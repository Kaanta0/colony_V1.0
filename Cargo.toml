[package]
name = "colony"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
iced = { version = "0.14.0", features = ["svg"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
shell-words = "1.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.27"
tokio = { version = "1.43.0", features = ["rt", "time"] }
toml = "0.9.11"
