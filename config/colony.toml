[scan]
# Liste de dossiers racines à analyser pour trouver des repos git.
# Mettez ici vos répertoires principaux (ex: "~/dev", "~/projects").
directories = ["~/dev", "~/projects"]

# Profondeur maximale de scan (1 = seulement les dossiers enfants directs).
max_depth = 2

# Intervalle en secondes pour les scans programmés (0 = désactivé pour l'instant).
interval_seconds = 0
